<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f0e6" />
    <meta
      name="description"
      content="Design your own wooden bird clock. Choose from 48 illustrated birds, mix three natural woods, and download your artwork."
    />
    <title>Bird Clock — Design your own</title>
    <link
      rel="icon"
      href="assets/birds/american-goldfinch.webp"
      type="image/webp"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="preload"
      href="assets/fonts/cormorant-400.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/inter-400.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
  </head>
  <body>
    <a class="skip-link" href="#editor">Skip to clock controls</a>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Bird Clock home">
        <img
          src="assets/birds/american-goldfinch.webp"
          alt=""
          width="48"
          height="48"
        />
        <span>Bird Clock</span>
      </a>
      <nav aria-label="Design actions">
        <span id="save-status" class="save-status"
          ><i></i>Saved in this browser</span
        ><button class="button primary" id="export-button">
          Save & share <span aria-hidden="true">↗</span>
        </button>
      </nav>
    </header>
    <main>
      <h1 class="sr-only">Design your bird clock</h1>
      <section class="workspace" aria-label="Clock design workspace">
        <div class="preview-column">
          <div class="preview-top">
            <div class="undo-controls">
              <button
                id="undo-button"
                class="icon-button"
                aria-label="Undo last change"
                title="Undo (Ctrl/⌘ Z)"
              >
                ↶</button
              ><button
                id="redo-button"
                class="icon-button"
                aria-label="Redo last change"
                title="Redo (Ctrl/⌘ Shift Z)"
              >
                ↷</button
              ><span></span
              ><button
                id="focus-button"
                class="icon-button"
                aria-label="View clock fullscreen"
                title="View fullscreen"
              >
                ⛶
              </button>
            </div>
          </div>
          <div class="clock-stage" id="clock-stage">
            <div id="clock" class="clock-wrap">
              <p class="loading">Opening the studio…</p>
            </div>
          </div>
        </div>
        <aside
          class="editor"
          id="editor"
          aria-label="Clock customization controls"
        >
          <div id="panel"></div>
        </aside>
      </section>
    </main>
    <dialog id="modal" aria-labelledby="modal-title">
      <div id="modal-content"></div>
    </dialog>
    <input
      type="file"
      id="json-input"
      accept=".json,application/json"
      hidden
    /><input
      type="file"
      id="bird-input"
      accept="image/png,image/jpeg,image/webp"
      hidden
    />
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript
      ><p class="noscript">
        Please enable JavaScript to customize your bird clock.
      </p></noscript
    >
    <script type="module" src="src/app.js"></script>
  </body>
</html>
